import pathlib

content = """site_name: "AnemoCore Documentation"
site_url: "https://chatchawich-c.github.io/AnemoCore"
repo_url: "https://github.com/chatchawich-c/AnemoCore"
repo_name: "AnemoCore"
nav:
  - Home: index.md
  - Usage: usage.md
  - Mathematical Formulations: MATHEMATICAL_FORMULATIONS.md
  - Python API: api/python.md
  - API Manual: API_USAGE_MANUAL.md
  - Roadmap: ROADMAP.md
  - ECO-WIND Benchmarks:
      - Overview: benchmarks/index.md
      - Results: benchmarks/results.md
theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.top
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - codehilite
