name: Build Wheels

permissions:
  contents: write
  id-token: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip --manifest-path bindings/python/Cargo.toml
      - name: Verify wheel size
        shell: python
        run: |
          import glob, os, sys
          wheels = glob.glob("target/wheels/*.whl")
          assert wheels, "No wheels built"
          for w in wheels:
              sz = os.path.getsize(w)
              print(f"{os.path.basename(w)}: {sz} bytes")
              if sz >= 5242880:
                  sys.exit(f"ERROR: {w} is {sz} bytes (>= 5 MiB)")
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: target/wheels/*.whl

  publish:
    needs: build-wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach wheels to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
