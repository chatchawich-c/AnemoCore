name: Build Wheels

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip --manifest-path bindings/python/Cargo.toml
      - name: Verify wheel size (< 5 MiB)
        run: python -c "import glob, os, sys; wheels = glob.glob('target/wheels/*.whl'); assert wheels, 'No wheels built'; [sys.exit(f'ERROR: {w} is {os.path.getsize(w)} bytes (>= 5 MiB)') for w in wheels if os.path.getsize(w) >= 5242880]; print('All wheels < 5 MiB:', [(os.path.basename(w), os.path.getsize(w)) for w in wheels])"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: target/wheels/*.whl

  release:
    needs: build-wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: wheels
      - uses: softprops/action-gh-release@v2
        with:
          files: wheels/**/*.whl
