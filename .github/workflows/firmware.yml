name: Firmware no_std & Renode vHIL
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  stm32f401-no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: cargo check -p anemocore --no-default-features --target thumbv7em-none-eabihf
      - run: cargo check --manifest-path firmware/stm32f401/Cargo.toml --target thumbv7em-none-eabihf
      - run: cargo test --manifest-path firmware/stm32f401/Cargo.toml
