[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "anemocore"
version = "0.1.0"
description = "Python bindings for the AnemoCore Rust core library via PyO3"
readme = "../../README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
authors = [{ name = "Chatchawich Chaihong", email = "6610130021@email.psu.ac.th" }]
keywords = ["wind-turbine", "prognostics", "grid-forming", "wavelet", "quasicrystal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26"]

[project.urls]
Homepage = "https://github.com/chatchawich/ecowind-suite"
Repository = "https://github.com/chatchawich/ecowind-suite"

[tool.maturin]
features = ["extension-module"]
module-name = "anemocore"
manifest-path = "Cargo.toml"
