[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "anemocore"
version = "0.3.4"
dependencies = ["numpy"]
description = "Python bindings for the AnemoCore Rust core library via PyO3"
readme = "../../README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
authors = [{ name = "Chatchawich Chaihong", email = "6610130021@email.psu.ac.th" }]
keywords = ["wind-turbine", "prognostics", "grid-forming", "wavelet", "quasicrystal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
io = ["polars>=1.0", "xarray>=2024.1"]


[project.urls]
Homepage = "https://github.com/chatchawich-c/AnemoCore"
Repository = "https://github.com/chatchawich-c/AnemoCore"

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "anemocore._core"
manifest-path = "Cargo.toml"
strip = true



