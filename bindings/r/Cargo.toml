[package]
name = "anemocore"

version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Chatchawich Chaihong <6610130021@email.psu.ac.th>"]
description = "R extendr bindings for anemocore."

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anemocore = { path = "../../crates/anemocore", package = "anemocore", features = ["std"] }
extendr-api = "0.7"


