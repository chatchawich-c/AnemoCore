[package]
name = "anemocore"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
description = "Pure-Rust (#![no_std] compatible) mathematical kernels for wind resource assessment, wake aerodynamics, and turbine prognostics."

[features]
default = ["std", "aero", "fleet", "econ"]
std = ["rayon", "rustfft", "serde", "serde_json"]
aero = ["std"]
fleet = ["std"]
econ = ["std"]
# Optional integration with SEMFlow (sharing faer = "0.20")
sem = ["std"]

[dependencies]
libm = { workspace = true }

microfft = { workspace = true }
rayon = { workspace = true, optional = true }

rustfft = { workspace = true, optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
[dev-dependencies]
