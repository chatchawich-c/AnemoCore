[workspace]
resolver = "2"
members = [
    "crates/anemocore",
    "bindings/python",
]
exclude = [
    "firmware",
    "bindings/r",
]
default-members = ["crates/anemocore"]

[workspace.package]
version = "0.3.3"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Chatchawich Chaihong <6610130021@email.psu.ac.th>"]
repository = "https://github.com/chatchawich-c/AnemoCore"
keywords = ["wind-turbine", "prognostics", "grid-forming", "wavelet", "no-std"]
categories = ["science", "embedded", "mathematics", "simulation"]

[workspace.dependencies]
libm = "0.2"

microfft = "0.6"
rayon = "1.10"

rustfft = "6.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
